<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522"><title>Чапи — панель владельца</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#171f31;--card:#1c2940;--line:#2c3a54;--text:#f4f6fb;--muted:#9ba8bd;--yellow:#ffd34e;--green:#55d6a0;--red:#ff7585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a2942 0%,var(--bg) 55%);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--yellow);color:#191d27;transition:transform .16s,filter .16s}button:active{transform:scale(.97)}button.secondary{background:#2a3850;color:var(--text);border:1px solid var(--line)}button.danger{background:#5a2634;color:#ffdce1;border:1px solid #83404e}input,select{width:100%;min-width:0;background:#101827;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--yellow)}.wrap{max-width:1120px;margin:auto;padding:20px 15px 50px}.brand{display:flex;align-items:center;gap:12px;margin:5px 0 20px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--yellow);color:#171d2a;font-size:24px}.brand h1{font-size:22px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}.login,.card{background:linear-gradient(145deg,#1b263a,#151e2f);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0002}.login{max-width:420px;margin:8vh auto}.login h2{margin:0 0 8px}.muted{color:var(--muted)}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.nav{display:flex;gap:8px;overflow:auto;padding:0 0 14px;margin-bottom:14px}.nav button{white-space:nowrap;flex:0 0 auto}.nav button.active{background:var(--yellow);color:#171d2a}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat .num{font-size:27px;font-weight:800;color:var(--yellow)}.stat .label{color:var(--muted);font-size:13px}.section{display:grid;gap:14px}.section h2{font-size:19px;margin:0}.section h3{font-size:15px;margin:0}.list{display:grid;gap:9px}.item{background:#131d2d;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item .details{min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);margin-top:3px}.toggle{flex:0 0 auto;width:48px;height:28px;border-radius:20px;padding:3px;background:#3a465a;border:1px solid #536078}.toggle span{display:block;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .16s}.toggle.on{background:#34795e}.toggle.on span{transform:translateX(20px)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{padding:11px 13px;border-radius:12px;background:#26344a;color:var(--text);margin-bottom:12px;overflow-wrap:anywhere}.msg.error{background:#512832}.msg.success{background:#1c493b}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:13px}.badge{font-size:12px;border-radius:999px;background:#293750;padding:4px 8px;color:#dbe5f5}.subnav{display:flex;gap:8px;flex-wrap:wrap}.subnav button{font-size:13px;padding:9px 11px}.item button{padding:8px 10px;font-size:13px}.wide{width:100%}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:15px 12px 35px}.brand h1{font-size:20px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.item{align-items:flex-start}.item .actions{flex:0 0 auto}.stat .num{font-size:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="wrap">
<header class="brand"><div class="logo">✦</div><div><h1>Чапи <span class="muted">/ владелец</span></h1><p>Защищённая панель управления ботом</p></div><div style="margin-left:auto"><button id="logout" class="secondary hidden">Выйти</button></div></header>
<div id="notice" class="msg hidden" role="status"></div>
<section id="loginView" class="login"><h2>Вход владельца</h2><p class="muted">Введите пароль панели, заданный в переменных окружения хостинга.</p><form id="loginForm" class="stack"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль панели" required maxlength="1024"><button class="wide" type="submit">Войти в панель</button></form><p class="muted" style="font-size:12px;margin-bottom:0">Не вводите сюда токен Telegram-бота.</p></section>
<section id="appView" class="hidden"><nav class="nav" id="nav"><button data-tab="overview" class="active">📊 Обзор</button><button data-tab="groups">👥 Группы</button><button data-tab="modules">🧩 Модули</button><button data-tab="staff">🛡 Штат</button><button data-tab="spam">🚫 Спам-блок</button><button data-tab="logs">📜 Журнал</button></nav><div id="content" class="section"></div></section>
<footer class="foot">Чапи • изменения применяются к общей базе данных бота</footer></main>
<script>
const $=s=>document.querySelector(s);let activeTab='overview';
const labels={antispam:'Антиспам',greetings:'Приветствия',notes:'Заметки',autoreplies:'Автоответы',count_messages:'Статистика сообщений',games:'Игры',economy:'Экономика',marriages:'Браки',clans:'Кланы'};
const roleLabels={admin:'Глобальный администратор',agent:'Агент'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(text,type=''){const n=$('#notice');n.textContent=text;n.className='msg'+(type?' '+type:'');n.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>n.classList.add('hidden'),5000)}
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data;try{data=await r.json()}catch{throw Error('Сервер вернул некорректный ответ ('+r.status+').')}if(!r.ok||data.ok===false){if(r.status===401){showLogin();}throw Error(data.error||'Ошибка запроса.')}return data}
function showLogin(){ $('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');$('#logout').classList.add('hidden') }
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#logout').classList.remove('hidden');loadTab(activeTab) }
function toggle(key,enabled,callback){return `<button class="toggle ${enabled?'on':''}" aria-label="${enabled?'Выключить':'Включить'}" data-toggle="${esc(key)}" data-enabled="${enabled}" onclick="${callback}"><span></span></button>`}
function stat(label,value){return `<div class="stat"><div class="num">${Number(value||0).toLocaleString('ru-RU')}</div><div class="label">${esc(label)}</div></div>`}
function empty(text){return `<div class="empty">${esc(text)}</div>`}
function item(title,sub,right){return `<div class="item"><div class="details"><b>${esc(title)}</b><small>${esc(sub||'')}</small></div><div class="actions">${right||''}</div></div>`}
async function loadTab(tab){activeTab=tab;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');c.innerHTML='<div class="empty">Загрузка…</div>';try{if(tab==='overview'){const d=await api('/api/panel/summary');c.innerHTML=`<div><h2>Обзор бота</h2><p class="muted">Сводка по данным текущей базы.</p></div><div class="grid">${stat('Пользователи',d.stats.users)}${stat('Группы',d.stats.groups)}${stat('Кланы',d.stats.clans)}${stat('Активные наказания',d.stats.active_punishments)}${stat('Заметки',d.stats.notes)}${stat('Автоответы',d.stats.autoreplies)}${stat('Глобальный спам-блок',d.stats.spamblocked)}</div><div class="card"><h3>Быстрые действия</h3><p class="muted">Настройки групп, глобальные модули, штат и спам-блок доступны во вкладках выше.</p><button onclick="loadTab('groups')">Открыть группы</button></div>`}
else if(tab==='groups'){const d=await api('/api/panel/groups');c.innerHTML=`<div><h2>Настройки групп</h2><p class="muted">Переключатели сохраняются в той же SQLite-базе, что использует бот.</p></div>`+(d.groups.length?d.groups.map(g=>`<div class="card"><h3>Группа ${esc(g.chat_id)}</h3><div class="list" style="margin-top:10px">${Object.entries(g.settings).map(([k,v])=>item(labels[k]||k,v?'Включено':'Выключено',toggleHtml(k,v,`groupToggle('${g.chat_id}','${k}',${!v})`))).join('')}</div></div>`).join(''):empty('Пока нет зарегистрированных групп. Добавьте бота в группу и дождитесь первого сообщения.'))}
else if(tab==='modules'){const d=await api('/api/panel/modules');c.innerHTML=`<div><h2>Глобальные модули</h2><p class="muted">Эти переключатели влияют на весь бот, если соответствующий обработчик использует глобальный реестр модулей.</p></div><div class="card list">${Object.entries(d.modules).map(([k,v])=>item(d.labels[k]||k,v?'Включён':'Выключен',toggleHtml(k,v,`moduleToggle('${k}',${!v})`))).join('')}</div>`}
else if(tab==='staff'){const d=await api('/api/panel/staff');c.innerHTML=`<div><h2>Управление штатом</h2><p class="muted">Владелец задан переменной OWNER_TELEGRAM_ID и не отображается как обычная запись.</p></div><form id="staffForm" class="card stack"><div class="formgrid"><input name="user_id" inputmode="numeric" placeholder="Telegram ID пользователя" required pattern="[0-9]+"><select name="role"><option value="agent">Агент</option><option value="admin">Глобальный администратор</option></select></div><div class="row"><button type="submit">Назначить роль</button><button type="button" class="secondary" onclick="staffRemovePrompt()">Снять роль по ID</button></div></form><div class="card"><h3>Текущий штат</h3><div class="list" style="margin-top:10px">${d.staff.length?d.staff.map(s=>item(roleLabels[s.role]||s.role,`ID ${s.user_id} · назначил ${s.granted_by||'—'}`,`<button class="danger" onclick="staffRemove(${s.user_id},'${s.role}')">Снять</button>`)).join(''):empty('Глобальный штат пока пуст.')}</div></div>`;$('#staffForm').addEventListener('submit',staffAdd)}
else if(tab==='spam'){const d=await api('/api/panel/spamblocks');c.innerHTML=`<div><h2>Глобальный спам-блок</h2><p class="muted">Блокировка ограничивает взаимодействие с ботом, но не является баном участника в Telegram-группе.</p></div><form id="spamForm" class="card stack"><input name="user_id" inputmode="numeric" pattern="[0-9]+" placeholder="Telegram ID" required><input name="reason" maxlength="300" placeholder="Причина блокировки" required><button type="submit">Добавить в спам-блок</button></form><div class="card"><h3>Заблокированные пользователи</h3><div class="list" style="margin-top:10px">${d.items.length?d.items.map(s=>item(`ID ${s.user_id}`,`${s.reason||'Причина не указана'} · ${s.source||'—'} · ${s.created_at?new Date(s.created_at*1000).toLocaleString('ru-RU'):'дата неизвестна'}`,`<button class="danger" onclick="spamRemove(${s.user_id})">Разблокировать</button>`)).join(''):empty('Глобальный спам-блок пуст.')}</div></div>`;$('#spamForm').addEventListener('submit',spamAdd)}
else if(tab==='logs'){const d=await api('/api/panel/logs?limit=50');c.innerHTML=`<div><h2>Журнал штата</h2><p class="muted">Последние 50 действий глобального штата.</p></div><div class="card list">${d.logs.length?d.logs.map(l=>item(l.action||'Действие',`${l.created_at?new Date(l.created_at*1000).toLocaleString('ru-RU'):'—'} · исполнитель ${l.actor_id||'—'} · цель ${l.target_id||'—'} · ${l.result||''}`)).join(''):empty('Записей пока нет.')}</div>`}
}catch(e){c.innerHTML=empty(e.message||'Не удалось загрузить данные.')}}
function toggleHtml(key,v,call){return `<button class="toggle ${v?'on':''}" aria-label="Переключить" onclick="${call}"><span></span></button>`}
async function groupToggle(chat_id,key,enabled){try{await api('/api/panel/group-setting',{method:'POST',body:JSON.stringify({chat_id:Number(chat_id),key,enabled})});notice('Настройка группы сохранена.','success');loadTab('groups')}catch(e){notice(e.message,'error')}}
async function moduleToggle(key,enabled){try{await api('/api/panel/module-action',{method:'POST',body:JSON.stringify({key,enabled})});notice('Глобальный модуль обновлён.','success');loadTab('modules')}catch(e){notice(e.message,'error')}}
async function staffAdd(e){e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/panel/staff-action',{method:'POST',body:JSON.stringify({user_id:f.get('user_id'),role:f.get('role'),action:'add'})});notice(d.message||'Роль назначена.','success');loadTab('staff')}catch(e){notice(e.message,'error')}}
async function staffRemove(id,role){if(!confirm(`Снять роль «${roleLabels[role]||role}» с пользователя ${id}?`))return;try{const d=await api('/api/panel/staff-action',{method:'POST',body:JSON.stringify({user_id:id,role,action:'remove'})});notice(d.message||'Роль снята.','success');loadTab('staff')}catch(e){notice(e.message,'error')}}
function staffRemovePrompt(){const id=prompt('Введите Telegram ID пользователя для снятия роли:');if(!id)return;if(!/^\d+$/.test(id)){notice('ID должен содержать только цифры.','error');return}const role=prompt('Введите роль: admin или agent','agent');if(!['admin','agent'].includes(role)){notice('Роль должна быть admin или agent.','error');return}staffRemove(Number(id),role)}
async function spamAdd(e){e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/panel/spamblock-action',{method:'POST',body:JSON.stringify({user_id:f.get('user_id'),reason:f.get('reason'),action:'add'})});notice(d.message||'Пользователь заблокирован.','success');loadTab('spam')}catch(e){notice(e.message,'error')}}
async function spamRemove(id){if(!confirm(`Убрать пользователя ${id} из глобального спам-блока?`))return;try{const d=await api('/api/panel/spamblock-action',{method:'POST',body:JSON.stringify({user_id:id,action:'remove'})});notice(d.message||'Блокировка снята.','success');loadTab('spam')}catch(e){notice(e.message,'error')}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/panel/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';showApp()}catch(e){notice(e.message,'error')}});
$('#logout').addEventListener('click',async()=>{try{await api('/api/panel/logout',{method:'POST',body:'{}'})}finally{showLogin();notice('Вы вышли из панели.')}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)loadTab(b.dataset.tab)});
(async()=>{try{const s=await api('/api/panel/session');if(s.authenticated)showApp();else showLogin();if(!s.configured)notice('Панель пока не настроена: добавьте PANEL_PASSWORD и PANEL_SESSION_SECRET в Environment на хостинге.','error')}catch{showLogin()}})();
</script></body></html>
